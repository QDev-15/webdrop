# netlify.toml — đặt ở root thư mục deploy demo
# Khi Netlify build, tự chạy build-demo.js trước khi publish

[build]
  command = "node Sources/templates/_demo-guard/build-demo.js"
  publish = "dist/demo"

[build.environment]
  NODE_VERSION = "18"

# Thêm headers bảo vệ cho tất cả files
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag        = "noindex, nofollow"
    X-Frame-Options     = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control       = "no-store, no-cache, must-revalidate"
    Referrer-Policy     = "no-referrer"

# HTML pages: thêm CSP
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com https://images.unsplash.com https://upload.wikimedia.org; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com"
