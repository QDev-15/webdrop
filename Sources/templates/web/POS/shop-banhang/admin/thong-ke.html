<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thống kê - Quản lý POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <meta name="description" content="Thống kê doanh thu">
</head>
<body>
  <nav class="bp-navbar">
    <div class="bp-navbar-brand">🍴 Admin POS</div>
    <ul class="bp-navbar-menu">
      <li><a href="index.html">Tổng quan</a></li>
      <li><a href="ql-menu.html">Quản lý menu</a></li>
      <li><a href="thong-ke.html">Thống kê</a></li>
    </ul>
    <div class="bp-navbar-user">
      <span id="userDisplay"></span>
      <button id="logoutBtn" class="bp-btn bp-btn-secondary bp-btn-sm" onclick="handleLogout()" style="display: none;">Đăng xuất</button>
    </div>
  </nav>

  <div class="bp-page-content">
    <div class="bp-container">
      <h1>Thống kê doanh thu</h1>

      <div class="bp-card" style="margin-bottom: 2rem;">
        <h3>Bộ lọc báo cáo</h3>
        <div class="bp-filter-row">
          <div class="bp-filter-group">
            <label for="fromDate">Từ ngày</label>
            <input type="date" id="fromDate">
          </div>
          <div class="bp-filter-group">
            <label for="toDate">Đến ngày</label>
            <input type="date" id="toDate">
          </div>
          <div class="bp-filter-group">
            <label for="categoryFilter">Nhóm (tuỳ chọn)</label>
            <select id="categoryFilter">
              <option value="">Tất cả</option>
            </select>
          </div>
          <div>
            <button class="bp-btn bp-btn-primary" onclick="generateReport()">Xem báo cáo</button>
            <button class="bp-btn bp-btn-secondary" onclick="resetFilter()" style="margin-left: 0.5rem;">Đặt lại</button>
          </div>
        </div>
      </div>

      <div class="bp-card" style="margin-bottom: 2rem;" id="reportSummary" style="display: none;">
        <h3>Tóm tắt</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
          <div style="padding: 1rem; background: var(--bg); border-radius: 8px;">
            <div style="color: var(--text-2); font-size: 0.9rem;">Số hóa đơn</div>
            <div style="font-size: 1.75rem; font-weight: 600; color: var(--accent);" id="totalOrders">0</div>
          </div>
          <div style="padding: 1rem; background: var(--bg); border-radius: 8px;">
            <div style="color: var(--text-2); font-size: 0.9rem;">Tổng doanh thu</div>
            <div style="font-size: 1.75rem; font-weight: 600; color: var(--accent);" id="totalRevenue">0đ</div>
          </div>
          <div style="padding: 1rem; background: var(--bg); border-radius: 8px;">
            <div style="color: var(--text-2); font-size: 0.9rem;">Doanh thu trung bình</div>
            <div style="font-size: 1.75rem; font-weight: 600; color: var(--accent);" id="avgRevenue">0đ</div>
          </div>
        </div>
      </div>

      <div class="bp-card" id="reportTable" style="display: none;">
        <h3>Chi tiết báo cáo</h3>
        <table class="bp-table">
          <thead>
            <tr>
              <th>Mã hóa đơn</th>
              <th>Số bàn</th>
              <th>Khách hàng</th>
              <th>Số lượng</th>
              <th>Thành tiền</th>
              <th>Thời gian</th>
            </tr>
          </thead>
          <tbody id="reportBody">
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-3);">Chưa có dữ liệu</td>
            </tr>
          </tbody>
        </table>
        <div style="margin-top: 1rem; text-align: right;">
          <button class="bp-btn bp-btn-primary" onclick="window.print()">🖨️ In báo cáo</button>
        </div>
      </div>

      <div id="noDataMsg" class="bp-card" style="text-align: center; color: var(--text-3);">
        Vui lòng chọn khoảng thời gian để xem báo cáo
      </div>
    </div>
  </div>

  <script src="../assets/js/seed-data.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    function initPage() {
      if (!POS.checkAdminAuth()) return;
      POS.updateUserDisplay();
      loadCategories();
      setDefaultDates();
    }

    function loadCategories() {
      const categories = POS.getCategories();
      const select = document.getElementById('categoryFilter');
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat.id;
        option.textContent = cat.name;
        select.appendChild(option);
      });
    }

    function setDefaultDates() {
      const today = new Date();
      const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

      document.getElementById('fromDate').valueAsDate = firstDayOfMonth;
      document.getElementById('toDate').valueAsDate = today;
    }

    function generateReport() {
      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;
      const categoryId = document.getElementById('categoryFilter').value;

      if (!fromDate || !toDate) {
        alert('Vui lòng chọn khoảng thời gian');
        return;
      }

      const orders = POS.getReportData(fromDate, toDate, categoryId || null);

      if (orders.length === 0) {
        document.getElementById('reportSummary').style.display = 'none';
        document.getElementById('reportTable').style.display = 'none';
        document.getElementById('noDataMsg').style.display = 'block';
        document.getElementById('noDataMsg').textContent = 'Không có dữ liệu trong khoảng thời gian này';
        return;
      }

      renderReportSummary(orders);
      renderReportTable(orders);

      document.getElementById('reportSummary').style.display = 'block';
      document.getElementById('reportTable').style.display = 'block';
      document.getElementById('noDataMsg').style.display = 'none';
    }

    function renderReportSummary(orders) {
      const totalOrders = orders.length;
      const totalRevenue = orders.reduce((sum, order) => sum + (order.total || 0), 0);
      const avgRevenue = totalRevenue / totalOrders;

      document.getElementById('totalOrders').textContent = totalOrders;
      document.getElementById('totalRevenue').textContent = POS.formatCurrency(totalRevenue);
      document.getElementById('avgRevenue').textContent = POS.formatCurrency(avgRevenue);
    }

    function renderReportTable(orders) {
      const tbody = document.getElementById('reportBody');
      tbody.innerHTML = '';

      orders.forEach(order => {
        const itemCount = order.items ? order.items.length : 0;
        const row = tbody.insertRow();
        row.innerHTML = `
          <td><strong>${order.id}</strong></td>
          <td>${POS.sanitizeInput(order.table)}</td>
          <td>${POS.sanitizeInput(order.customer)}</td>
          <td>${itemCount}</td>
          <td>${POS.formatCurrency(order.total)}</td>
          <td>${order.timestamp}</td>
        `;
      });
    }

    function resetFilter() {
      setDefaultDates();
      document.getElementById('categoryFilter').value = '';
      document.getElementById('reportSummary').style.display = 'none';
      document.getElementById('reportTable').style.display = 'none';
      document.getElementById('noDataMsg').style.display = 'block';
      document.getElementById('noDataMsg').textContent = 'Vui lòng chọn khoảng thời gian để xem báo cáo';
    }

    function handleLogout() {
      if (confirm('Bạn chắc chắn muốn đăng xuất?')) {
        POS.logout();
        window.location.href = '../index.html';
      }
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
