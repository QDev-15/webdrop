<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý menu - Quản lý POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <meta name="description" content="Quản lý sản phẩm và biến thể">
</head>
<body>
  <nav class="bp-navbar">
    <div class="bp-navbar-brand">🍴 Admin POS</div>
    <ul class="bp-navbar-menu">
      <li><a href="index.html">Tổng quan</a></li>
      <li><a href="ql-menu.html">Quản lý menu</a></li>
      <li><a href="nhap-kho.html">Nhập kho</a></li>
      <li><a href="kiem-kho.html">Kiểm kho</a></li>
      <li><a href="ql-khach-hang.html">Khách hàng</a></li>
      <li><a href="thong-ke.html">Thống kê</a></li>
    </ul>
    <div class="bp-navbar-user">
      <span id="userDisplay"></span>
      <button id="logoutBtn" class="bp-btn bp-btn-secondary bp-btn-sm" onclick="Auth.handleLogoutClick()" style="display: none;">Đăng xuất</button>
    </div>
  </nav>

  <div class="bp-page-content">
    <div class="bp-container">
      <h1>Quản lý menu</h1>

      <div class="bp-card" style="margin-bottom: 2rem;">
        <h3 id="formTitle">Thêm sản phẩm</h3>
        <form id="productForm" onsubmit="handleSaveProduct(event)">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="bp-input-group">
              <label for="productName">Tên sản phẩm</label>
              <input type="text" id="productName" required placeholder="Nhập tên sản phẩm">
            </div>
            <div class="bp-input-group">
              <label for="productCategory">Nhóm</label>
              <select id="productCategory" required></select>
            </div>
            <div class="bp-input-group">
              <label for="productPrice">Giá bán (đ)</label>
              <input type="number" id="productPrice" required min="0" placeholder="Nhập giá bán">
            </div>
            <div class="bp-input-group">
              <label for="productCost">Giá vốn (đ)</label>
              <input type="number" id="productCost" required min="0" placeholder="Nhập giá vốn">
            </div>
            <div class="bp-input-group">
              <label for="productUnit">Đơn vị</label>
              <input type="text" id="productUnit" required placeholder="VD: suất, ly, cái">
            </div>
            <div class="bp-input-group">
              <label for="productBarcode">Mã vạch</label>
              <input type="text" id="productBarcode" placeholder="VD: 8938501234501">
            </div>
            <div class="bp-input-group">
              <label for="productStock">Tồn kho</label>
              <input type="number" id="productStock" min="0" placeholder="Số lượng tồn kho">
            </div>
            <div class="bp-input-group">
              <label for="productMinStock">Tồn kho tối thiểu</label>
              <input type="number" id="productMinStock" min="0" placeholder="Ngưỡng cảnh báo">
            </div>
          </div>

          <div class="bp-switch-row">
            <label class="bp-switch">
              <input type="checkbox" id="hasVariantsToggle">
              <span class="bp-switch-slider"></span>
            </label>
            <label for="hasVariantsToggle" style="margin:0; cursor:pointer;">Có biến thể (size / màu)</label>
          </div>

          <div class="bp-variant-editor" id="variantEditor" style="display:none;">
            <div id="variantRows"></div>
            <button type="button" class="bp-btn bp-btn-secondary bp-btn-sm" onclick="addVariantRow()">+ Thêm biến thể</button>
          </div>

          <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="bp-btn bp-btn-primary">Lưu</button>
            <button type="button" class="bp-btn bp-btn-secondary" onclick="resetForm()">Huỷ</button>
          </div>
        </form>
        <div id="successAlert" class="bp-alert" style="margin-top: 1rem;"></div>
      </div>

      <div class="bp-input-group" style="margin-bottom: 1rem;">
        <input type="text" class="bp-search" id="searchInput" placeholder="Tìm sản phẩm theo tên/SKU...">
      </div>

      <div class="bp-card">
        <h3>Danh sách sản phẩm</h3>
        <table class="bp-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tên</th>
              <th>Nhóm</th>
              <th>Giá bán</th>
              <th>Tồn kho</th>
              <th>Biến thể</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="productList">
            <tr>
              <td colspan="7" style="text-align: center; color: var(--text-3);">Đang tải...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../assets/js/seed-data.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/inventory.js"></script>
  <script>
    let editingId = null;
    let variantRowCount = 0;

    function initPage() {
      if (!Auth.checkAdminAuth()) return;
      Auth.updateUserDisplay();
      loadCategories();
      renderProducts();

      document.getElementById('searchInput').addEventListener('input', handleSearch);
      document.getElementById('hasVariantsToggle').addEventListener('change', (e) => {
        document.getElementById('variantEditor').style.display = e.target.checked ? 'block' : 'none';
        if (e.target.checked && document.getElementById('variantRows').children.length === 0) {
          addVariantRow();
        }
      });
    }

    function loadCategories() {
      const categories = POS.getCategories();
      const select = document.getElementById('productCategory');
      select.innerHTML = '';
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat.id;
        option.textContent = cat.name;
        select.appendChild(option);
      });
    }

    function addVariantRow(data) {
      variantRowCount++;
      const wrap = document.getElementById('variantRows');
      const row = document.createElement('div');
      row.className = 'bp-variant-editor-row';
      row.dataset.rowId = variantRowCount;
      row.innerHTML = `
        <input type="text" placeholder="Size (S/M/L)" class="v-size" value="${data ? POS.escapeHtml(data.size) : ''}">
        <input type="text" placeholder="Màu/Loại" class="v-color" value="${data ? POS.escapeHtml(data.color) : ''}">
        <input type="text" placeholder="SKU" class="v-sku" value="${data ? POS.escapeHtml(data.sku) : ''}">
        <input type="number" placeholder="Tồn kho" class="v-stock" min="0" value="${data ? data.stock : ''}">
        <button type="button" class="bp-order-item-remove" onclick="this.closest('.bp-variant-editor-row').remove()">✕</button>
      `;
      wrap.appendChild(row);
    }

    function collectVariants() {
      const rows = document.querySelectorAll('#variantRows .bp-variant-editor-row');
      const variants = [];
      rows.forEach(row => {
        const size = row.querySelector('.v-size').value.trim();
        const color = row.querySelector('.v-color').value.trim();
        let sku = row.querySelector('.v-sku').value.trim();
        const stock = Number(row.querySelector('.v-stock').value) || 0;
        if (!size && !color) return;
        if (!sku) sku = Inventory.suggestSku(document.getElementById('productName').value, size, color);
        variants.push({ sku, size, color, stock, price: Number(document.getElementById('productPrice').value) || 0 });
      });
      return variants;
    }

    function renderProducts(products) {
      const allProducts = products || POS.getProducts();
      const tbody = document.getElementById('productList');
      tbody.innerHTML = '';

      if (allProducts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-3);">Không tìm thấy sản phẩm nào</td></tr>';
        return;
      }

      allProducts.forEach(product => {
        const category = POS.getCategories().find(c => c.id === product.categoryId);
        const totalStock = POS.getTotalStock(product);
        const low = POS.isLowStock(product);
        const row = tbody.insertRow();
        row.innerHTML = `
          <td>${product.id}</td>
          <td>${POS.escapeHtml(product.name)}</td>
          <td>${category ? POS.escapeHtml(category.name) : 'N/A'}</td>
          <td>${product.hasVariants ? 'Từ ' + POS.formatCurrency(POS.getMinPrice(product)) : POS.formatCurrency(product.price)}</td>
          <td>${totalStock}${low ? ' <span class="bp-badge-low-stock">⚠ Thấp</span>' : ''}</td>
          <td>${product.hasVariants ? product.variants.length + ' biến thể' : '—'}</td>
          <td>
            <button class="bp-btn bp-btn-secondary bp-btn-sm" data-edit="${product.id}">Sửa</button>
            <button class="bp-btn bp-btn-danger bp-btn-sm" data-delete="${product.id}">Xóa</button>
          </td>
        `;
      });

      tbody.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => editProduct(Number(btn.dataset.edit))));
      tbody.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => deleteProduct(Number(btn.dataset.delete))));
    }

    function handleSaveProduct(event) {
      event.preventDefault();

      const name = document.getElementById('productName').value.trim();
      const categoryId = parseInt(document.getElementById('productCategory').value);
      const price = parseFloat(document.getElementById('productPrice').value);
      const costPrice = parseFloat(document.getElementById('productCost').value);
      const unit = document.getElementById('productUnit').value.trim();
      const barcode = document.getElementById('productBarcode').value.trim();
      const stock = parseInt(document.getElementById('productStock').value) || 0;
      const minStock = parseInt(document.getElementById('productMinStock').value) || 0;
      const hasVariants = document.getElementById('hasVariantsToggle').checked;

      if (!name) { alert('Vui lòng nhập tên sản phẩm'); return; }
      if (price <= 0) { alert('Giá bán phải lớn hơn 0'); return; }
      if (isNaN(costPrice) || costPrice < 0) { alert('Giá vốn không hợp lệ'); return; }
      if (barcode && POS.getProducts().some(p => p.barcode === barcode && p.id !== editingId)) {
        alert('Mã vạch này đã được dùng cho sản phẩm khác'); return;
      }

      let variants = [];
      if (hasVariants) {
        variants = collectVariants();
        if (variants.length === 0) { alert('Vui lòng thêm ít nhất 1 biến thể hoặc tắt "Có biến thể"'); return; }
        const skus = variants.map(v => v.sku);
        if (new Set(skus).size !== skus.length) { alert('SKU biến thể bị trùng, vui lòng kiểm tra lại'); return; }
      }

      const productData = {
        name, categoryId, price, costPrice, unit,
        barcode: barcode || null,
        stock, minStock,
        hasVariants,
        variants: hasVariants ? variants : undefined,
        image: 'https://images.unsplash.com/photo-1512058564366-18510be2db19?w=400&h=400&fit=crop'
      };

      if (editingId) {
        const existing = POS.getProductById(editingId);
        if (existing) {
          productData.id = editingId;
          productData.image = existing.image || productData.image;
          POS.saveProduct(productData);
        }
        editingId = null;
      } else {
        POS.saveProduct(productData);
      }

      showSuccess('Lưu sản phẩm thành công');
      resetForm();
      renderProducts();
    }

    function editProduct(id) {
      const product = POS.getProductById(id);
      if (!product) return;

      editingId = id;
      document.getElementById('formTitle').textContent = 'Sửa sản phẩm — ' + product.name;
      document.getElementById('productName').value = product.name;
      document.getElementById('productCategory').value = product.categoryId;
      document.getElementById('productPrice').value = product.price;
      document.getElementById('productCost').value = product.costPrice || 0;
      document.getElementById('productUnit').value = product.unit;
      document.getElementById('productBarcode').value = product.barcode || '';
      document.getElementById('productStock').value = product.stock || 0;
      document.getElementById('productMinStock').value = product.minStock || 0;

      document.getElementById('variantRows').innerHTML = '';
      const toggle = document.getElementById('hasVariantsToggle');
      toggle.checked = !!product.hasVariants;
      document.getElementById('variantEditor').style.display = product.hasVariants ? 'block' : 'none';
      if (product.hasVariants) {
        product.variants.forEach(v => addVariantRow(v));
      }

      document.getElementById('productName').focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteProduct(id) {
      if (!confirm('Bạn chắc chắn muốn xóa sản phẩm này?')) return;
      POS.deleteProduct(id);
      showSuccess('Xóa sản phẩm thành công');
      resetForm();
      renderProducts();
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const products = POS.getProducts().filter(p =>
        p.name.toLowerCase().includes(query) ||
        (p.barcode && p.barcode.includes(query)) ||
        (p.hasVariants && p.variants.some(v => v.sku.toLowerCase().includes(query)))
      );
      renderProducts(products);
    }

    function resetForm() {
      editingId = null;
      document.getElementById('formTitle').textContent = 'Thêm sản phẩm';
      document.getElementById('productForm').reset();
      document.getElementById('hasVariantsToggle').checked = false;
      document.getElementById('variantEditor').style.display = 'none';
      document.getElementById('variantRows').innerHTML = '';
      document.getElementById('searchInput').value = '';
      renderProducts();
    }

    function showSuccess(message) {
      const alert = document.getElementById('successAlert');
      alert.textContent = message;
      alert.className = 'bp-alert success show';
      setTimeout(() => {
        alert.classList.remove('show');
      }, 3000);
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
