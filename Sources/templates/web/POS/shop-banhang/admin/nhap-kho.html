<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhập kho - Quản lý POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <meta name="description" content="Nhập kho hàng hóa">
</head>
<body>
  <nav class="bp-navbar">
    <div class="bp-navbar-brand">🍴 Admin POS</div>
    <ul class="bp-navbar-menu">
      <li><a href="index.html">Tổng quan</a></li>
      <li><a href="ql-menu.html">Quản lý menu</a></li>
      <li><a href="nhap-kho.html">Nhập kho</a></li>
      <li><a href="kiem-kho.html">Kiểm kho</a></li>
      <li><a href="ql-khach-hang.html">Khách hàng</a></li>
      <li><a href="thong-ke.html">Thống kê</a></li>
    </ul>
    <div class="bp-navbar-user">
      <span id="userDisplay"></span>
      <button id="logoutBtn" class="bp-btn bp-btn-secondary bp-btn-sm" onclick="Auth.handleLogoutClick()" style="display: none;">Đăng xuất</button>
    </div>
  </nav>

  <div class="bp-page-content">
    <div class="bp-container">
      <h1>Nhập kho</h1>

      <div class="bp-card" style="margin-bottom: 2rem;">
        <h3>Tạo phiếu nhập</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
          <div class="bp-input-group">
            <label for="supplierSelect">Nhà cung cấp</label>
            <select id="supplierSelect"></select>
          </div>
          <div class="bp-input-group">
            <label for="newSupplierInput">Hoặc thêm nhà cung cấp mới</label>
            <div style="display:flex; gap:0.5rem;">
              <input type="text" id="newSupplierInput" placeholder="Tên nhà cung cấp mới">
              <button type="button" class="bp-btn bp-btn-secondary bp-btn-sm" onclick="handleAddSupplier()">+ Thêm</button>
            </div>
          </div>
          <div class="bp-input-group">
            <label for="importDate">Ngày nhập</label>
            <input type="date" id="importDate">
          </div>
        </div>

        <table class="bp-table">
          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>Biến thể</th>
              <th>Số lượng</th>
              <th>Đơn giá nhập</th>
              <th>Thành tiền</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="importRows"></tbody>
        </table>
        <button type="button" class="bp-btn bp-btn-secondary bp-btn-sm" onclick="addImportRow()">+ Thêm dòng sản phẩm</button>

        <div class="bp-summary-row total" style="margin-top:1rem;">
          <span>Tổng tiền nhập:</span>
          <span id="importTotalDisplay">0đ</span>
        </div>

        <div id="importAlert" class="bp-alert" style="margin-top:1rem;"></div>
        <button class="bp-btn bp-btn-primary" onclick="handleConfirmImport()" style="margin-top:1rem;">Xác nhận nhập kho</button>
      </div>

      <div class="bp-card">
        <h3>Lịch sử phiếu nhập</h3>
        <table class="bp-table">
          <thead>
            <tr>
              <th>Ngày</th>
              <th>Nhà cung cấp</th>
              <th>Số mặt hàng</th>
              <th>Tổng tiền</th>
            </tr>
          </thead>
          <tbody id="importHistoryBody">
            <tr><td colspan="4" style="text-align:center; color:var(--text-3);">Chưa có phiếu nhập nào</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../assets/js/seed-data.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/inventory.js"></script>
  <script>
    let rowCount = 0;

    function initPage() {
      if (!Auth.checkAdminAuth()) return;
      Auth.updateUserDisplay();
      // Dùng POS.dateOnly() (giờ địa phương) thay vì valueAsDate (giờ UTC) để tránh
      // lệch ngày vào buổi sáng sớm ở múi giờ Việt Nam (UTC+7)
      document.getElementById('importDate').value = POS.todayISODate();
      loadSuppliers();
      addImportRow();
      renderHistory();
    }

    function loadSuppliers() {
      const select = document.getElementById('supplierSelect');
      select.innerHTML = '';
      POS.getSuppliers().forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        select.appendChild(opt);
      });
    }

    function handleAddSupplier() {
      const name = document.getElementById('newSupplierInput').value.trim();
      if (!name) return;
      POS.addSupplier(name);
      document.getElementById('newSupplierInput').value = '';
      loadSuppliers();
      document.getElementById('supplierSelect').value = name;
    }

    function productOptionsHtml(selectedId) {
      return POS.getProducts().map(p =>
        `<option value="${p.id}" ${selectedId === p.id ? 'selected' : ''}>${POS.escapeHtml(p.name)}</option>`
      ).join('');
    }

    function variantOptionsHtml(product) {
      if (!product || !product.hasVariants) return '<option value="">—</option>';
      return product.variants.map(v =>
        `<option value="${POS.escapeHtml(v.sku)}">${POS.escapeHtml(v.size)}/${POS.escapeHtml(v.color)} (tồn ${v.stock})</option>`
      ).join('');
    }

    function addImportRow() {
      rowCount++;
      const tbody = document.getElementById('importRows');
      const products = POS.getProducts();
      const firstProduct = products[0];
      const row = document.createElement('tr');
      row.dataset.rowId = rowCount;
      row.innerHTML = `
        <td><select class="row-product" style="min-width:160px;">${productOptionsHtml(firstProduct ? firstProduct.id : null)}</select></td>
        <td><select class="row-variant" style="min-width:130px;">${variantOptionsHtml(firstProduct)}</select></td>
        <td><input type="number" class="row-qty" min="1" value="1" style="width:80px; padding:0.4rem; border:1px solid var(--border); border-radius:6px;"></td>
        <td><input type="number" class="row-cost" min="0" value="${firstProduct ? firstProduct.costPrice : 0}" style="width:110px; padding:0.4rem; border:1px solid var(--border); border-radius:6px;"></td>
        <td class="row-line-total">0đ</td>
        <td><button type="button" class="bp-order-item-remove" onclick="this.closest('tr').remove(); updateImportTotal();">✕</button></td>
      `;
      tbody.appendChild(row);

      const productSelect = row.querySelector('.row-product');
      const variantSelect = row.querySelector('.row-variant');
      const costInput = row.querySelector('.row-cost');

      productSelect.addEventListener('change', () => {
        const product = POS.getProductById(Number(productSelect.value));
        variantSelect.innerHTML = variantOptionsHtml(product);
        costInput.value = product ? product.costPrice : 0;
        updateImportTotal();
      });

      [variantSelect, costInput].forEach(el => el.addEventListener('input', updateImportTotal));
      row.querySelector('.row-qty').addEventListener('input', updateImportTotal);

      updateImportTotal();
    }

    function updateImportTotal() {
      let total = 0;
      document.querySelectorAll('#importRows tr').forEach(row => {
        const qty = Number(row.querySelector('.row-qty').value) || 0;
        const cost = Number(row.querySelector('.row-cost').value) || 0;
        const lineTotal = qty * cost;
        row.querySelector('.row-line-total').textContent = POS.formatCurrency(lineTotal);
        total += lineTotal;
      });
      document.getElementById('importTotalDisplay').textContent = POS.formatCurrency(total);
    }

    function handleConfirmImport() {
      const alertEl = document.getElementById('importAlert');
      const supplier = document.getElementById('supplierSelect').value;
      const date = document.getElementById('importDate').value;

      const lines = [];
      document.querySelectorAll('#importRows tr').forEach(row => {
        const productId = Number(row.querySelector('.row-product').value);
        const variantSelect = row.querySelector('.row-variant');
        const variantSku = variantSelect.value || null;
        const quantity = Number(row.querySelector('.row-qty').value);
        const unitCost = Number(row.querySelector('.row-cost').value);
        lines.push({ productId, variantSku, quantity, unitCost });
      });

      try {
        Inventory.createStockImport(supplier, date, lines);
        alertEl.textContent = 'Nhập kho thành công! Tồn kho đã được cập nhật.';
        alertEl.className = 'bp-alert success show';
        document.getElementById('importRows').innerHTML = '';
        rowCount = 0;
        addImportRow();
        renderHistory();
      } catch (e) {
        alertEl.textContent = e.message;
        alertEl.className = 'bp-alert error show';
      }
    }

    function renderHistory() {
      const imports = POS.getStockImports().slice().reverse();
      const tbody = document.getElementById('importHistoryBody');
      tbody.innerHTML = '';
      if (imports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-3);">Chưa có phiếu nhập nào</td></tr>';
        return;
      }
      imports.forEach(imp => {
        const row = tbody.insertRow();
        row.innerHTML = `
          <td>${POS.formatDateVN(imp.date)}</td>
          <td>${POS.escapeHtml(imp.supplier)}</td>
          <td>${imp.items.length}</td>
          <td>${POS.formatCurrency(imp.totalCost)}</td>
        `;
      });
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
