<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trả hàng - POS Bán hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="description" content="Trả hàng và hoàn tiền cho khách">
</head>
<body>
  <nav class="bp-navbar">
    <div class="bp-navbar-brand">🍴 POS Bán Hàng</div>
    <ul class="bp-navbar-menu">
      <li><a href="lap-don.html">Lập đơn</a></li>
      <li><a href="tra-hang.html">Trả hàng</a></li>
      <li><a href="ca-lam-viec.html">Ca làm việc</a></li>
      <li><a href="gioi-thieu.html">Giới thiệu</a></li>
      <li><a href="lien-he.html">Liên hệ</a></li>
    </ul>
    <div class="bp-navbar-user">
      <span id="userDisplay"></span>
      <button id="logoutBtn" class="bp-btn bp-btn-secondary bp-btn-sm" onclick="Auth.handleLogoutClick()" style="display: none;">Đăng xuất</button>
    </div>
  </nav>

  <div class="bp-page-content">
    <div class="bp-container">
      <h1>Trả hàng / Hoàn tiền</h1>

      <div class="bp-card" style="margin-bottom: 1.5rem;">
        <h3>Tìm hóa đơn gốc</h3>
        <div style="display:flex; gap:0.75rem; align-items:flex-end; flex-wrap:wrap;">
          <div class="bp-input-group" style="flex:1; min-width:220px; margin-bottom:0;">
            <label for="orderIdInput">Mã hóa đơn</label>
            <input type="text" id="orderIdInput" placeholder="VD: HD1736300000000">
          </div>
          <button class="bp-btn bp-btn-primary" onclick="handleFindOrder()">Tìm hóa đơn</button>
        </div>
        <div id="findAlert" class="bp-alert" style="margin-top:1rem;"></div>
      </div>

      <div class="bp-card" id="returnFormCard" style="display:none;">
        <h3>Chi tiết hóa đơn <span id="orderIdLabel"></span></h3>
        <p style="color: var(--text-2);" id="orderMetaLabel"></p>

        <table class="bp-table">
          <thead>
            <tr>
              <th style="width:36px;"></th>
              <th>Sản phẩm</th>
              <th>Đã mua</th>
              <th>Đã trả trước</th>
              <th>Số lượng trả</th>
              <th>Thành tiền</th>
            </tr>
          </thead>
          <tbody id="returnItemsBody"></tbody>
        </table>

        <div class="bp-input-group" style="max-width:320px; margin-top:1rem;">
          <label for="returnReason">Lý do trả hàng</label>
          <select id="returnReason">
            <option value="">-- Chọn lý do --</option>
            <option value="loi-san-pham">Lỗi sản phẩm</option>
            <option value="doi-y">Đổi ý</option>
            <option value="giao-nham">Giao nhầm</option>
            <option value="khac">Khác</option>
          </select>
        </div>

        <div class="bp-summary-row total" style="margin-top:1rem;">
          <span>Tổng tiền hoàn:</span>
          <span id="refundTotalDisplay">0đ</span>
        </div>

        <div id="returnAlert" class="bp-alert" style="margin-top:1rem;"></div>

        <button class="bp-btn bp-btn-primary" onclick="handleConfirmReturn()" style="margin-top:1rem;">Xác nhận hoàn tiền</button>
        <button class="bp-btn bp-btn-secondary" onclick="resetReturnForm()" style="margin-top:1rem;">Huỷ</button>
      </div>
    </div>
  </div>

  <script src="assets/js/seed-data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/inventory.js"></script>
  <script src="assets/js/returns.js"></script>
  <script>
    let currentOrder = null;
    let returnableItems = [];

    function initPage() {
      if (!Auth.checkAuth()) return;
      Auth.updateUserDisplay();
    }

    function handleFindOrder() {
      const orderId = document.getElementById('orderIdInput').value.trim();
      const alertEl = document.getElementById('findAlert');
      const order = Returns.findOrder(orderId);

      if (!order) {
        alertEl.textContent = 'Không tìm thấy hóa đơn với mã: ' + orderId;
        alertEl.className = 'bp-alert error show';
        document.getElementById('returnFormCard').style.display = 'none';
        return;
      }

      alertEl.className = 'bp-alert';
      currentOrder = order;
      returnableItems = Returns.getReturnableItems(order);
      renderReturnForm();
    }

    function renderReturnForm() {
      document.getElementById('returnFormCard').style.display = 'block';
      document.getElementById('orderIdLabel').textContent = currentOrder.id;
      document.getElementById('orderMetaLabel').textContent =
        `Khách: ${currentOrder.customer || 'Khách lẻ'} · Thời gian: ${POS.formatDateTimeVN(currentOrder.timestamp)} · Tổng tiền: ${POS.formatCurrency(currentOrder.total)}`;

      const tbody = document.getElementById('returnItemsBody');
      tbody.innerHTML = '';

      returnableItems.forEach((item, idx) => {
        const row = tbody.insertRow();
        const variantLabel = item.size ? ` (${item.size}/${item.color})` : '';
        row.innerHTML = `
          <td><input type="checkbox" class="return-check" data-idx="${idx}" ${item.maxReturnable === 0 ? 'disabled' : ''}></td>
          <td>${POS.escapeHtml(item.name)}${POS.escapeHtml(variantLabel)}</td>
          <td>${item.quantity}</td>
          <td>${item.alreadyReturned}</td>
          <td style="max-width:110px;">
            <input type="number" class="return-qty" data-idx="${idx}" min="0" max="${item.maxReturnable}" value="0"
              style="width:80px; padding:0.4rem; border:1px solid var(--border); border-radius:6px;" ${item.maxReturnable === 0 ? 'disabled' : ''}>
          </td>
          <td>${POS.formatCurrency(item.price)}/${POS.escapeHtml(item.unit)}</td>
        `;
      });

      tbody.querySelectorAll('.return-check').forEach(cb => cb.addEventListener('change', handleCheckToggle));
      tbody.querySelectorAll('.return-qty').forEach(inp => inp.addEventListener('input', updateRefundTotal));

      updateRefundTotal();
    }

    function handleCheckToggle(e) {
      const idx = e.target.dataset.idx;
      const qtyInput = document.querySelector(`.return-qty[data-idx="${idx}"]`);
      if (e.target.checked) {
        qtyInput.value = returnableItems[idx].maxReturnable > 0 ? 1 : 0;
      } else {
        qtyInput.value = 0;
      }
      updateRefundTotal();
    }

    function getSelections() {
      const selections = [];
      document.querySelectorAll('.return-qty').forEach(inp => {
        const qty = Number(inp.value) || 0;
        if (qty > 0) {
          const item = returnableItems[Number(inp.dataset.idx)];
          selections.push({
            productId: item.productId, variantSku: item.variantSku,
            name: item.name, price: item.price, quantity: qty
          });
        }
      });
      return selections;
    }

    function updateRefundTotal() {
      const selections = getSelections();
      const total = selections.reduce((s, sel) => s + sel.price * sel.quantity, 0);
      document.getElementById('refundTotalDisplay').textContent = POS.formatCurrency(total);
    }

    function handleConfirmReturn() {
      const alertEl = document.getElementById('returnAlert');
      const reason = document.getElementById('returnReason').value;
      const selections = getSelections();

      try {
        const record = Returns.processReturn(currentOrder, selections, reason);
        alertEl.textContent = `Hoàn tiền thành công: ${POS.formatCurrency(record.refundAmount)}. Tồn kho đã được cộng lại.`;
        alertEl.className = 'bp-alert success show';
        currentOrder = Returns.findOrder(currentOrder.id);
        returnableItems = Returns.getReturnableItems(currentOrder);
        renderReturnForm();
      } catch (e) {
        alertEl.textContent = e.message;
        alertEl.className = 'bp-alert error show';
      }
    }

    function resetReturnForm() {
      currentOrder = null;
      returnableItems = [];
      document.getElementById('orderIdInput').value = '';
      document.getElementById('returnFormCard').style.display = 'none';
      document.getElementById('findAlert').className = 'bp-alert';
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
