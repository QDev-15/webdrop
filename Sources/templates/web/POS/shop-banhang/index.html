<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - POS Bán hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="description" content="Đăng nhập hệ thống quản lý bán hàng POS">
</head>
<body class="bp-login-container">
  <div class="bp-login-box">
    <h1>POS Bán Hàng</h1>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="bp-form-group">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" required placeholder="Nhập tên đăng nhập" autocomplete="username">
      </div>
      <div class="bp-form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu" autocomplete="current-password">
      </div>
      <div id="errorAlert" class="bp-alert"></div>
      <button type="submit" class="bp-btn bp-btn-primary bp-btn-full">Đăng nhập</button>
      <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-2);">
        <p><strong>Tài khoản demo:</strong></p>
        <p>Thu ngân: nv01 / 123456</p>
        <p>Quản lý: admin / admin123</p>
      </div>
    </form>
  </div>

  <script src="assets/js/seed-data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Vui lòng nhập tên đăng nhập và mật khẩu');
        return;
      }

      if (Auth.login(username, password)) {
        const session = Auth.getSession();
        if (session.role === 'admin') {
          window.location.href = 'admin/index.html';
        } else {
          window.location.href = 'lap-don.html';
        }
      } else {
        showError('Tên đăng nhập hoặc mật khẩu không chính xác');
      }
    }

    function showError(message) {
      const alert = document.getElementById('errorAlert');
      alert.textContent = message;
      alert.className = 'bp-alert error show';
      setTimeout(() => {
        alert.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
